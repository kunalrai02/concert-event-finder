version: '3.8'

services:
  web:
    build: .
    command: >
      bash -c "flask db upgrade && python run.py"
    volumes:
      - .:/app
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql+psycopg://kunal_admin:root@postgres:5432/concert_event_finder
      - REDIS_URL=redis://redis:6379/0
      - FLASK_APP=run.py
      - FLASK_ENV=development
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  celery:
    build: .
    command: celery -A app.core.extensions.celery_app worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql+psycopg://kunal_admin:root@postgres:5432/concert_event_finder
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=kunal_admin
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=concert_event_finder
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kunal_admin -d concert_event_finder"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
